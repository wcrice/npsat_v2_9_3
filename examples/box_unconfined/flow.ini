# Unconfined steady-state flow through a 1000 x 1000 x 100 m box with uniform recharge.
# West face held at 80 m, east face at 60 m, Kxy = Kz = 1 m/d, recharge 0.0005 m/d on the top.
[Paths]
Main = .
Input = input
Output = out/

[Geometry]
Type = BOX
BoxDims = 1000,1000,100
BoxLLP = 0,0,0
Top = 100
Bottom = 0

[Discretization]
Nxyz = 10,10,5
Vertical = 0,0.2,0.4,0.6,0.8,1

[Refinement]
Initial = 0
Wells = 0
Streams = 0
Top = 0
TopDepth = 0
Dirichlet = 0
GHB = 0
Neumann = 0

[BC]
Dirichlet = dirichlet.dat
Neumann =
GHB =
HalfWidth = 10
MinOverlap = 50

[Properties]
Kxy = kxy.master
Kz = kz.master
Sy = sy.master
Ss = ss.master

[Sources]
Rch_Data = rch.master
Well_Data =
Well_Rates =
Stream_Data =
Stream_Rates =

[IC]
Head = ic.master

[Simulation]
Nsteps = 1
Start_step = 0
Delta_time_file = dt.dat
Confined = 0
Steady_state = 1

[Solver]
System_iterations = 15000
System_tol = 1e-12

[Output]
Prefix = box
Save_trace_data = 1
Save_fine_velocities = 1
Print_solution_cell_vtu = 1
Print_cell_budget_csv = 1
Print_cellcenters_vtk = 1

[Misc]
Print_matrices = 0
Verbose_level = 1
LogFile = nonlinear.log
